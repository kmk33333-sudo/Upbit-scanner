name: Update Upbit data

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upbit-data

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Upbit daily candles
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          API = "https://api.upbit.com/v1"

          def get(url):
              for i in range(6):
                  try:
                      req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return json.load(r)
                  except urllib.error.HTTPError as e:
                      if e.code != 429 and e.code < 500:
                          raise
                  except Exception:
                      pass
                  time.sleep(1 + i)
              raise RuntimeError("failed: " + url)

          os.makedirs("data", exist_ok=True)
          allm = get(API + "/market/all?isDetails=true")
          for quote in ["KRW", "BTC", "USDT"]:
              ms = [m for m in allm if m["market"].startswith(quote + "-")]
              tick = {}
              for i in range(0, len(ms), 100):
                  codes = ",".join(m["market"] for m in ms[i:i + 100])
                  for t in get(API + "/ticker?markets=" + codes):
                      tick[t["market"]] = t
              out = []
              for m in ms:
                  try:
                      c = get(API + "/candles/days?market=" + m["market"] + "&count=200")
                  except Exception as e:
                      print(e)
                      continue
                  c.reverse()
                  t = tick.get(m["market"], {})
                  ev = m.get("market_event") or {}
                  out.append({
                      "m": m["market"], "k": m["korean_name"], "e": m["english_name"],
                      "w": m.get("market_warning") == "CAUTION" or bool(ev.get("warning")),
                      "c": [x["trade_price"] for x in c],
                      "d": [x["candle_date_time_kst"][5:10] for x in c],
                      "p": t.get("trade_price"), "r": t.get("signed_change_rate", 0), "v": t.get("acc_trade_price_24h", 0),
                  })
                  time.sleep(0.13)
              with open("data/" + quote + ".json", "w") as f:
                  json.dump({"quote": quote, "at": int(time.time() * 1000), "total": len(ms), "markets": out},
                            f, ensure_ascii=False, separators=(",", ":"))
              print(quote, len(out), "of", len(ms))
          PY

      - name: Save data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Update Upbit data" || exit 0
          git push
