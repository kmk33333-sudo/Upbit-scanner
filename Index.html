<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f3f7">
<title>업비트 60·120 스캐너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column, sticky control bar, dense tappable rows. Korean market colors: 상승=red, 하락=blue. */
:root{
  --bg:#f2f3f7; --surface:#ffffff; --line:#dfe1ea; --ink:#161a2c; --muted:#646a82;
  --up:#d42a3c; --down:#1d5bd0; --gold:#a8730a; --gold-bg:#fbf1da;
  --ma60:#d42a3c; --ma120:#1d5bd0; --price:#9aa0b6; --focus:#5a4fd6;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12141d; --surface:#1b1e2a; --line:#2b2f3f; --ink:#e9ebf3; --muted:#959bb3;
  --up:#ff5a68; --down:#5c93ff; --gold:#e8b44a; --gold-bg:#33290f;
  --ma60:#ff5a68; --ma120:#5c93ff; --price:#5d6380; --focus:#9a90ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141d; --surface:#1b1e2a; --line:#2b2f3f; --ink:#e9ebf3; --muted:#959bb3;
  --up:#ff5a68; --down:#5c93ff; --gold:#e8b44a; --gold-bg:#33290f;
  --ma60:#ff5a68; --ma120:#5c93ff; --price:#5d6380; --focus:#9a90ff; color-scheme:dark}

*{box-sizing:border-box}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

header{padding-block:20px 6px}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
h1 .k60{color:var(--ma60)} h1 .k120{color:var(--ma120)}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:7px 4px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.row2{display:flex;gap:8px}
.row2 input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px}
.row2 select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-size:13px;max-width:44%}
.scan{border:0;background:var(--up);color:#fff;border-radius:10px;padding:0 14px;font-weight:700;font-size:14px;cursor:pointer}
.scan:disabled{opacity:.55;cursor:default}

.status{padding-block:12px 4px;font-size:13px;color:var(--muted);display:grid;gap:6px}
.status b{color:var(--ink);font-weight:700}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--up);transition:width .2s}
.err{background:var(--surface);border:1px solid var(--up);color:var(--ink);border-radius:10px;padding:12px;font-size:14px}

.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding-block:6px 2px}
.legend span::before{content:"";display:inline-block;width:14px;height:2px;margin-right:5px;vertical-align:middle;background:var(--c)}

ul.list{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li.item{background:var(--surface)}
.itembtn{all:unset;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;width:100%;padding:12px 14px;cursor:pointer}
.itembtn:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sym{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:6px;font-weight:400}
.price{text-align:right;font-weight:600;font-size:15px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.chg{text-align:right;font-size:12px}
.up{color:var(--up)} .down{color:var(--down)}
.badge{font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;line-height:1.5}
.badge.new{background:var(--gold-bg);color:var(--gold)}
.badge.warn{border:1px solid var(--up);color:var(--up)}
.spark{grid-column:1/-1;margin-top:6px}
.spark svg{display:block;width:100%;height:34px}
.detail{padding:0 14px 14px;display:grid;gap:10px}
.detail svg{display:block;width:100%;height:150px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px;color:var(--muted)}
.kv div b{display:block;color:var(--ink);font-size:13px;font-weight:600}
.detail a{color:var(--focus);font-size:13px;font-weight:500}

.empty{padding:28px 14px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:8px}
footer{margin-top:22px;font-size:12px;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>업비트 <span class="k60">60일선</span> &gt; <span class="k120">120일선</span></h1>
    <p class="sub">일봉 종가 기준 단순이동평균(SMA). 60일선이 120일선 위에 있는 코인만 보여줍니다.</p>
  </header>

  <div class="bar">
    <div class="seg" id="quoteSeg" role="group" aria-label="마켓">
      <button id="q-KRW" data-q="KRW" aria-pressed="true">원화 KRW</button>
      <button id="q-BTC" data-q="BTC" aria-pressed="false">BTC</button>
      <button id="q-USDT" data-q="USDT" aria-pressed="false">USDT</button>
    </div>
    <div class="seg" id="rangeSeg" role="group" aria-label="돌파 시점">
      <button id="r-all" data-r="0" aria-pressed="true">위에 있는 전체</button>
      <button id="r-20" data-r="20" aria-pressed="false">20일 내 돌파</button>
      <button id="r-5" data-r="5" aria-pressed="false">5일 내 돌파</button>
    </div>
    <div class="row2">
      <input id="search" type="search" placeholder="코인 이름·심볼 검색" autocomplete="off">
      <select id="sort" aria-label="정렬">
        <option value="cross">최근 돌파순</option>
        <option value="gap">이격 큰 순</option>
        <option value="chg">24h 상승률순</option>
        <option value="vol">거래대금순</option>
      </select>
      <button class="scan" id="scanBtn">스캔</button>
    </div>
  </div>

  <div class="status" id="status">
    <div id="statusText">스캔을 누르면 업비트에서 일봉을 받아 계산합니다.</div>
    <div class="prog" id="prog" hidden><i id="progBar"></i></div>
  </div>
  <div class="err" id="err" hidden></div>

  <div class="legend" id="legend" hidden>
    <span style="--c:var(--ma60)">60일선</span>
    <span style="--c:var(--ma120)">120일선</span>
    <span style="--c:var(--price)">종가</span>
  </div>
  <ul class="list" id="list" hidden></ul>
  <div class="empty" id="empty" hidden>조건에 맞는 코인이 없어요.</div>

  <footer>
    데이터: 업비트 공개 시세 API (로그인·API 키 불필요). 오늘 일봉은 진행 중인 값이 포함되며, 업비트 일봉은 오전 9시(KST)에 바뀝니다.
    상장 120일 미만 코인은 120일선을 계산할 수 없어 제외됩니다. 투자 판단의 참고용이며 매매 권유가 아닙니다.
  </footer>
</div>

<script>
(() => {
  const API = "https://api.upbit.com/v1";
  const $ = id => document.getElementById(id);
  const state = { quote: "KRW", range: 0, sort: "cross", q: "", data: null, open: new Set(), scanning: false };

  // ---------- storage (optional) ----------
  const store = {
    get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };
  const prefs = store.get("ma-prefs");
  if (prefs) Object.assign(state, { quote: prefs.quote || "KRW", range: prefs.range ?? 0, sort: prefs.sort || "cross" });

  // ---------- network ----------
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  async function getJSON(url, tries = 5) {
    for (let i = 0; i < tries; i++) {
      const res = await fetch(url, { headers: { accept: "application/json" } });
      if (res.status === 429) { await sleep(500 * (i + 1)); continue; }
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }
    throw new Error("요청 한도 초과(429)");
  }

  // ---------- math ----------
  function sma(arr, n) {
    const out = new Array(arr.length).fill(null); let s = 0;
    for (let i = 0; i < arr.length; i++) {
      s += arr[i]; if (i >= n) s -= arr[i - n];
      if (i >= n - 1) out[i] = s / n;
    }
    return out;
  }
  function analyze(candles) {
    const c = candles.slice().reverse(); // oldest -> newest
    const closes = c.map(x => x.trade_price);
    if (closes.length < 120) return { short: true };
    const m60 = sma(closes, 60), m120 = sma(closes, 120);
    const L = closes.length - 1;
    const above = m60[L] > m120[L];
    let crossDays = null, older = false;
    if (above) {
      let i = L;
      while (i >= 119 && m60[i] > m120[i]) i--;
      if (i < 119) older = true;          // above for the whole window we can see
      else crossDays = L - (i + 1);       // 0 = crossed today
    }
    const tail = 60, s = Math.max(119, L - tail + 1);
    return {
      above, crossDays, older,
      ma60: m60[L], ma120: m120[L],
      gap: m60[L] / m120[L] - 1,
      close: closes[L],
      spark: { c: closes.slice(s), a: m60.slice(s), b: m120.slice(s), d: c.slice(s).map(x => x.candle_date_time_kst.slice(5,10)) },
      visible: L - 119
    };
  }

  // ---------- scan ----------
  async function scan() {
    if (state.scanning) return;
    state.scanning = true; $("scanBtn").disabled = true; $("err").hidden = true;
    const quote = state.quote;
    setProgress(0, "마켓 목록을 불러오는 중…");
    try {
      const all = await getJSON(API + "/market/all?isDetails=true");
      const markets = all.filter(m => m.market.startsWith(quote + "-"));
      const tick = {};
      for (let i = 0; i < markets.length; i += 100) {
        const chunk = markets.slice(i, i + 100).map(m => m.market).join(",");
        (await getJSON(API + "/ticker?markets=" + chunk)).forEach(t => tick[t.market] = t);
      }
      const results = []; let done = 0, short = 0, failed = 0;
      const queue = markets.slice();
      const worker = async () => {
        while (queue.length) {
          const m = queue.shift();
          try {
            const candles = await getJSON(API + "/candles/days?market=" + m.market + "&count=200");
            const a = analyze(candles);
            if (a.short) short++;
            else if (a.above) {
              const t = tick[m.market] || {};
              results.push({
                market: m.market, sym: m.market.split("-")[1], name: m.korean_name, en: m.english_name,
                warn: m.market_warning === "CAUTION" || !!(m.market_event && m.market_event.warning),
                price: t.trade_price ?? a.close, chg: t.signed_change_rate ?? 0, vol: t.acc_trade_price_24h ?? 0, ...a
              });
            }
          } catch { failed++; }
          done++;
          setProgress(done / markets.length, `${markets.length}종목 중 ${done}종목 확인 중…`);
          await sleep(380);
        }
      };
      await Promise.all([worker(), worker(), worker()]);
      state.data = { quote, at: Date.now(), total: markets.length, short, failed, items: results };
      store.set("ma-cache-" + quote, state.data);
      render();
    } catch (e) {
      const blocked = e instanceof TypeError;
      $("err").hidden = false;
      $("err").textContent = blocked
        ? "업비트 서버에 연결하지 못했어요. 인터넷 연결을 확인하고, 이 파일을 Claude 미리보기가 아니라 폰의 Chrome·Safari 같은 브라우저에서 직접 열어 주세요."
        : "불러오는 중 문제가 생겼어요 (" + e.message + "). 잠시 후 스캔을 다시 눌러 주세요.";
      setProgress(null, state.data ? "" : "스캔하지 못했어요.");
      if (state.data) render();
    } finally {
      state.scanning = false; $("scanBtn").disabled = false;
    }
  }

  function setProgress(p, text) {
    $("prog").hidden = p === null;
    if (p !== null) $("progBar").style.width = (p * 100).toFixed(1) + "%";
    if (text) $("statusText").textContent = text;
  }

  // ---------- formatting ----------
  function fmtPrice(v, quote) {
    if (v == null) return "-";
    if (quote === "BTC") return v.toFixed(8).replace(/0+$/, "").replace(/\.$/, "");
    const d = v >= 1000 ? 0 : v >= 100 ? 1 : v >= 1 ? 2 : v >= 0.01 ? 4 : 6;
    return v.toLocaleString("ko-KR", { minimumFractionDigits: quote === "USDT" ? Math.max(2, d) : d, maximumFractionDigits: quote === "USDT" ? Math.max(2, d) : d });
  }
  const pct = v => (v > 0 ? "+" : "") + (v * 100).toFixed(2) + "%";
  function fmtVol(v, quote) {
    if (quote !== "KRW") return Math.round(v).toLocaleString("ko-KR") + " " + quote;
    if (v >= 1e12) return (v / 1e12).toFixed(1) + "조";
    if (v >= 1e8) return Math.round(v / 1e8).toLocaleString("ko-KR") + "억";
    return Math.round(v / 1e4).toLocaleString("ko-KR") + "만";
  }
  const crossLabel = it => it.older ? `${it.visible}일+ 유지` : it.crossDays === 0 ? "오늘 돌파" : `돌파 ${it.crossDays}일째`;
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[ch]));

  // ---------- charts ----------
  function chart(sp, h, big) {
    const W = 600, pad = big ? 6 : 2, vals = [...sp.c, ...sp.a, ...sp.b];
    let lo = Math.min(...vals), hi = Math.max(...vals); if (hi === lo) hi = lo + 1;
    const n = sp.c.length, x = i => (i / (n - 1)) * W, y = v => pad + (1 - (v - lo) / (hi - lo)) * (h - pad * 2);
    const line = arr => arr.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    let extra = "";
    if (big) {
      extra = [0.25, 0.5, 0.75].map(f => `<line x1="0" x2="${W}" y1="${(pad + f * (h - pad * 2)).toFixed(1)}" y2="${(pad + f * (h - pad * 2)).toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`).join("")
        + `<text x="2" y="12" font-size="11" fill="var(--muted)" font-family="var(--mono)">${esc(sp.d[0])}</text>`
        + `<text x="${W - 2}" y="12" font-size="11" fill="var(--muted)" text-anchor="end" font-family="var(--mono)">${esc(sp.d[n - 1])}</text>`;
    }
    const sw = big ? 2 : 1.6;
    return `<svg viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" aria-hidden="true">${extra}
      <polyline points="${line(sp.c)}" fill="none" stroke="var(--price)" stroke-width="${big ? 1.4 : 1.1}" vector-effect="non-scaling-stroke"/>
      <polyline points="${line(sp.b)}" fill="none" stroke="var(--ma120)" stroke-width="${sw}" vector-effect="non-scaling-stroke"/>
      <polyline points="${line(sp.a)}" fill="none" stroke="var(--ma60)" stroke-width="${sw}" vector-effect="non-scaling-stroke"/>
    </svg>`;
  }

  // ---------- render ----------
  function render() {
    syncControls();
    const d = state.data;
    if (!d) { $("list").hidden = $("empty").hidden = $("legend").hidden = true; return; }
    const q = state.q.trim().toLowerCase();
    let items = d.items.filter(it => {
      if (state.range && (it.older || it.crossDays > state.range)) return false;
      if (q && !(it.name.toLowerCase().includes(q) || it.sym.toLowerCase().includes(q) || (it.en || "").toLowerCase().includes(q))) return false;
      return true;
    });
    const crossKey = it => it.older ? 9999 : it.crossDays;
    const by = { cross: (a, b) => crossKey(a) - crossKey(b) || b.gap - a.gap, gap: (a, b) => b.gap - a.gap, chg: (a, b) => b.chg - a.chg, vol: (a, b) => b.vol - a.vol };
    items.sort(by[state.sort]);

    const t = new Date(d.at);
    const when = `${t.getMonth() + 1}/${t.getDate()} ${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}`;
    const filtered = state.range || q ? ` · 필터 결과 <b>${items.length}</b>` : "";
    $("statusText").innerHTML = `${d.quote} 마켓 ${d.total}종목 중 <b>${d.items.length}종목</b>이 60일선 위${filtered}<br>`
      + `상장 120일 미만 ${d.short}종목 제외${d.failed ? ` · 불러오기 실패 ${d.failed}` : ""} · 기준 ${when}`;
    $("prog").hidden = true;

    $("legend").hidden = items.length === 0;
    $("empty").hidden = items.length !== 0;
    $("list").hidden = items.length === 0;
    $("list").innerHTML = items.map(it => {
      const isOpen = state.open.has(it.market);
      const cls = it.chg > 0 ? "up" : it.chg < 0 ? "down" : "";
      const fresh = !it.older && it.crossDays <= 5;
      return `<li class="item">
        <button class="itembtn" data-m="${esc(it.market)}" aria-expanded="${isOpen}">
          <div class="name">${esc(it.name)}<span class="sym">${esc(it.sym)}</span></div>
          <div class="price num ${cls}">${fmtPrice(it.price, d.quote)}</div>
          <div class="meta">
            ${fresh ? `<span class="badge new">${crossLabel(it)}</span>` : `<span>${crossLabel(it)}</span>`}
            <span>· 이격 <span class="num up">${pct(it.gap)}</span></span>
            ${it.warn ? `<span class="badge warn">유의</span>` : ""}
          </div>
          <div class="chg num ${cls}">${pct(it.chg)}</div>
          ${isOpen ? "" : `<div class="spark">${chart(it.spark, 34, false)}</div>`}
        </button>
        ${isOpen ? `<div class="detail">
          ${chart(it.spark, 150, true)}
          <div class="kv">
            <div>60일선<b class="num">${fmtPrice(it.ma60, d.quote)}</b></div>
            <div>120일선<b class="num">${fmtPrice(it.ma120, d.quote)}</b></div>
            <div>24h 거래대금<b class="num">${fmtVol(it.vol, d.quote)}</b></div>
          </div>
          <a href="https://upbit.com/exchange?code=CRIX.UPBIT.${encodeURIComponent(it.market)}" target="_blank" rel="noopener">업비트에서 차트 보기 →</a>
        </div>` : ""}
      </li>`;
    }).join("");
  }

  function syncControls() {
    document.querySelectorAll("#quoteSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.q === state.quote));
    document.querySelectorAll("#rangeSeg button").forEach(b => b.setAttribute("aria-pressed", +b.dataset.r === state.range));
    $("sort").value = state.sort;
  }
  const savePrefs = () => store.set("ma-prefs", { quote: state.quote, range: state.range, sort: state.sort });

  // ---------- events ----------
  $("quoteSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || state.scanning || b.dataset.q === state.quote) return;
    state.quote = b.dataset.q; state.open.clear(); savePrefs();
    state.data = store.get("ma-cache-" + state.quote);
    render(); if (!state.data) scan();
  });
  $("rangeSeg").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    state.range = +b.dataset.r; savePrefs(); render();
  });
  $("sort").addEventListener("change", e => { state.sort = e.target.value; savePrefs(); render(); });
  $("search").addEventListener("input", e => { state.q = e.target.value; render(); });
  $("scanBtn").addEventListener("click", scan);
  $("list").addEventListener("click", e => {
    const b = e.target.closest(".itembtn"); if (!b) return;
    const m = b.dataset.m; state.open.has(m) ? state.open.delete(m) : state.open.add(m); render();
  });

  // ---------- start ----------
  state.data = store.get("ma-cache-" + state.quote);
  render();
  const stale = !state.data || Date.now() - state.data.at > 30 * 60 * 1000;
  if (stale) scan();
})();
</script>
</body>
</html>
